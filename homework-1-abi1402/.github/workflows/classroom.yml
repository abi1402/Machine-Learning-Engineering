name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true 

    - name: Install git LFS explicitly
      run: |
        sudo apt-get update
        sudo apt-get install -y git-lfs
        git lfs install
        git lfs pull
        
    - name: Verify LFS files  
      run: |
        ls -lh X_emb_train.pkl X_emb_test.pkl
        head -c 20 X_emb_train.pkl | xxd  # Should NOT show "version"
    - name: submission_test
      id: submission_test
      uses: classroom-resources/autograding-python-grader@v1
      with:
        timeout: 60
        setup-command: |
          pip3 install --upgrade pip setuptools
          pip3 install -U -r requirements.txt
          pip3 install jupyter nbconvert pytest